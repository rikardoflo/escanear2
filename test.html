<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Test Captura</title>
<style>
body{font-family:sans-serif;padding:20px;background:#f5f5f5;}
.btn{display:block;width:100%;padding:14px;margin:10px 0;background:#1a3a6b;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;}
.btn:disabled{opacity:0.3;}
.btn-green{background:#00b4a6;}
.status{padding:12px;margin:10px 0;border-radius:8px;font-size:14px;}
.ok{background:#e6f4ea;color:#1a7a3c;}
.err{background:#fce8e8;color:#b91c1c;}
input[type=file]{display:none;}
label.file-btn{display:block;width:100%;padding:14px;margin:10px 0;background:#eee;border:2px dashed #ccc;border-radius:8px;font-size:15px;cursor:pointer;text-align:center;box-sizing:border-box;}
label.file-btn.done{background:#e8f1fb;border-color:#1a3a6b;}
</style>
</head>
<body>

<h2>Test de Captura</h2>

<label class="file-btn" id="lbl_card" for="inp_card">📷 Foto de la TARJETA</label>
<input type="file" accept="image/*" capture="environment" id="inp_card">

<label class="file-btn" id="lbl_person" for="inp_person">🤳 Foto de la PERSONA</label>
<input type="file" accept="image/*" capture="user" id="inp_person">

<div id="status" class="status" style="display:none"></div>

<button class="btn" id="btnGo" disabled>✓ Ambas fotos cargadas — continuar</button>

<script>
var cardOk = false, personOk = false;

function log(msg, ok) {
  var s = document.getElementById('status');
  s.className = 'status ' + (ok ? 'ok' : 'err');
  s.textContent = msg;
  s.style.display = 'block';
}

function check() {
  log('Tarjeta: ' + (cardOk?'✓':'✗') + '  |  Persona: ' + (personOk?'✓':'✗'), cardOk && personOk);
  document.getElementById('btnGo').disabled = !(cardOk && personOk);
}

document.getElementById('inp_card').addEventListener('change', function(e) {
  var f = e.target.files[0];
  if (!f) { log('No se seleccionó archivo para tarjeta', false); return; }
  log('Tarjeta recibida: ' + f.name + ' (' + Math.round(f.size/1024) + 'KB)', true);
  cardOk = true;
  document.getElementById('lbl_card').textContent = '✅ Tarjeta cargada';
  document.getElementById('lbl_card').classList.add('done');
  check();
});

document.getElementById('inp_person').addEventListener('change', function(e) {
  var f = e.target.files[0];
  if (!f) { log('No se seleccionó archivo para persona', false); return; }
  log('Persona recibida: ' + f.name + ' (' + Math.round(f.size/1024) + 'KB)', true);
  personOk = true;
  document.getElementById('lbl_person').textContent = '✅ Persona cargada';
  document.getElementById('lbl_person').classList.add('done');
  check();
});

document.getElementById('btnGo').onclick = function() {
  log('¡Funciona! Ambas fotos listas.', true);
};
</script>
</body>
</html>
